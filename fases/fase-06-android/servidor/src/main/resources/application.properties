spring.application.name=missao-marte-servidor

# Só a própria máquina acessa por padrão. Para abrir: MISSAOMARTE_ENDERECO=0.0.0.0 (e use HTTPS).
server.address=${MISSAOMARTE_ENDERECO:127.0.0.1}
# A porta própria ganha; sem ela, vale a PORT que os provedores de nuvem informam; sem as duas, 8080.
# O encerramento gracioso já é o padrão do Spring Boot 4 (server.shutdown=graceful): sem linha aqui.
server.port=${MISSAOMARTE_PORTA:${PORT:8080}}

# H2 em arquivo; a pasta troca com MISSAOMARTE_DADOS.
spring.datasource.url=jdbc:h2:file:${MISSAOMARTE_DADOS:./dados}/missaomarte
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JSON estrito: enum só pelo nome (0 não vira VITORIA), número com casa decimal ou entre aspas não vira inteiro.
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# Segredo do token (mínimo 32 bytes), só pela variável de ambiente.
# Vazio: o servidor gera um aleatório a cada subida e os tokens antigos deixam de valer.
missaomarte.jwt.segredo=${MISSAOMARTE_JWT_SEGREDO:}
